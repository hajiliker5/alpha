events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /dev/null;

    # DNS داخلی داکر برای حل اسم کویب هنگام اجرا
    resolver 1.1.1.1 8.8.8.8 valid=60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # سلامت‌سنجی Back4app
        location = /healthz { return 200 "ok\n"; }

        location / {
            # ---- مقصد: سرور Xray شما روی کویب ----
            set $backend "modern-othilie-hamed740-1a276e2d.koyeb.app";
            proxy_pass https://$backend;
            proxy_set_header Host modern-othilie-hamed740-1a276e2d.koyeb.app;
            proxy_ssl_server_name on;
            proxy_ssl_name modern-othilie-hamed740-1a276e2d.koyeb.app;

            # وب‌سوکت (برای VLESS/Xray حیاتی است)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # اتصال‌های طولانی قطع نشوند
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering off;
        }
    }
}
